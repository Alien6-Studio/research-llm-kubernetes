# Specimen only: exporter and Prometheus metric conservation must be qualified.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workers-backlog
  namespace: a6-autoscaling
spec:
  scaleTargetRef:
    name: workers
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 8
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 0
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.a6-autoscaling.svc:9090
        query: sum(alien6_pending_requests)
        threshold: '20'
