# Specimen for the future isolated study; no controller has been measured.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workers-cpu
  namespace: a6-autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workers
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
