name: Independent Linux research
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Calibration only, or essential contrasts after full qualification
        type: choice
        default: calibrate
        options: [calibrate, focused]
permissions:
  contents: read
concurrency:
  group: independent-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the verified official kind binary
        run: |
          curl --fail --location --silent --show-error https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 -o /tmp/kind
          printf '%s  %s\n' '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54' /tmp/kind | sha256sum --check
          chmod +x /tmp/kind
          /tmp/kind create cluster --config infra/kind.yaml --kubeconfig .kubeconfig-a6-research --wait 120s
      - name: Build and deploy the exact study executable
        run: |
          docker update --cpus 4 --memory 8g --memory-swap 8g a6-research-control-plane
          docker build -t alien6-research-capacity:study-v3 .
          /tmp/kind load docker-image alien6-research-capacity:study-v3 --name a6-research
          python run.py deploy
      - name: Calibrate before the essential contrasts
        env:
          RESEARCH_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          mkdir -p study-logs
          kubectl --kubeconfig .kubeconfig-a6-research -n a6-research port-forward service/controller 18081:8080 > study-logs/port-forward.txt 2>&1 &
          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" || true' EXIT
          python -c 'import time,urllib.request; [(time.sleep(.2)) for _ in range(10)]'
          python run.py calibrate --out runs/linux-${{ github.run_id }}-calibration
          python scripts/check_qualification.py runs/linux-${{ github.run_id }}-calibration
          if [ "$RESEARCH_SCOPE" = focused ]; then
            python run.py focused --out runs/linux-${{ github.run_id }}-focused
          fi
      - name: Retain every result, including failed qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-research-${{ github.run_id }}
          path: |
            runs/linux-*
            study-logs/
          if-no-files-found: warn
          retention-days: 90
