name: Research CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Research checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore lossless native baseline inputs without a model server
        run: python scripts/check_cpu_continuation.py --restore-only > /tmp/native-baseline-restore.json
      - name: Restore lossless paired admission inputs without a model server
        if: ${{ hashFiles('archives/shared-admission/evidence-index.json') != '' }}
        run: python scripts/check_shared_admission.py --restore-only > /tmp/shared-admission-restore.json
      - name: Run research controls
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Recompute complete qualification blocks
        run: python scripts/analyze_calibration.py --check
      - name: Recompute independently hosted essential contrasts
        run: python scripts/analyze_focused.py --check
      - name: Verify published evidence identity
        run: python scripts/verify_evidence.py
      - name: Replay V2 workloads and measured records
        run: python -m v2.verify > /tmp/capacity-verification.json
      - name: Check the historical archive inventory against retained records
        run: python scripts/inventory_legacy_evidence.py --check
      - name: Replay all 45 native observations and their lifecycle evidence
        run: python scripts/check_cpu_continuation.py > /tmp/native-baseline-verification.json
      - name: Verify the paired admission protocol without claiming collection completion
        run: python scripts/check_shared_admission.py --mode protocol --github-summary > /tmp/shared-admission-protocol.json
      - name: Replay the complete paired collection when experimental artifacts are present
        if: ${{ hashFiles('archives/shared-admission/evidence-index.json', 'archives/v2-ollama-shared-admission/collection-manifest.json', 'analysis/v2-ollama-shared-admission/results.json', 'analysis/v2-ollama-shared-admission/trials.csv', 'runs/shared-admission/trials/*/real-model/*.json') != '' }}
        run: python scripts/check_shared_admission.py --mode final --github-summary > /tmp/shared-admission-final.json
      - name: Check published numerical tables and CSV
        run: python -m v2.report --check
      - name: Check canonical results and article evidence
        run: python -m v2.publication --check
      - name: Rebuild standalone scientific figures from the archived outcomes
        run: |
          python -m pip install -r requirements-analysis.txt
          MPLCONFIGDIR=/tmp/alien6-mpl python -m v2.report --figures --output /tmp/alien6-figures
          test -s /tmp/alien6-figures/replicas-and-admission.svg
          test -s /tmp/alien6-figures/quota-counterfactual.svg
          test -s /tmp/alien6-figures/cpu-counterfactual.svg
          test -s /tmp/alien6-figures/deadline-and-quota-consumption.svg
          MPLCONFIGDIR=/tmp/alien6-mpl python scripts/plot_shared_admission.py --out /tmp/alien6-figures
          test -s /tmp/alien6-figures/shared-admission-pairs.svg
      - name: Build the pinned service image
        run: docker build -t research-capacity:ci .
      - name: Build the V2 service and model measurement images
        run: |
          SOURCE_ID="$(python -c 'from pathlib import Path; from v2.identity import capture, verify_worktree; s = capture(Path.cwd()); verify_worktree(Path.cwd(), s.source_id); print(s.source_id)')"
          docker build -f v2/Dockerfile --build-arg SOURCE_COMMIT="$GITHUB_SHA" --build-arg SOURCE_ID="$SOURCE_ID" -t research-capacity:v2-ci .
          docker build -f v2/Model.Dockerfile --build-arg SOURCE_COMMIT="$GITHUB_SHA" --build-arg SOURCE_ID="$SOURCE_ID" -t research-capacity:model-ci .
      - name: Retain scientific replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scientific-replay-${{ github.sha }}
          path: |
            /tmp/capacity-verification.json
            /tmp/native-baseline-restore.json
            /tmp/native-baseline-verification.json
            /tmp/shared-admission-protocol.json
            /tmp/shared-admission-restore.json
            /tmp/shared-admission-final.json
            /tmp/alien6-figures/
          if-no-files-found: warn
          retention-days: 90
